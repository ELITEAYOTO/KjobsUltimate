# ============================================================
# EXEMPLES GUI KjobsUltimate - Etape 1
# ============================================================
# Ce fichier est un exemple uniquement.
# Ne le renomme pas en quests.yml.
#
# Toutes ces options fonctionnent dans gui/home.yml, gui/jobs.yml
# et gui/quests.yml sur n'importe quelle section d'item.

# ------------------------------------------------------------
# 1. GLOW SUR UN ITEM
# ------------------------------------------------------------

exemple_glow:
  slot: 22
  material: EMERALD
  name: "&aObjet lumineux"
  lore:
    - "&7Le faux enchantement est masqué."
  glow: true

# ------------------------------------------------------------
# 2. HEAD DATABASE
# ------------------------------------------------------------
# HeadDatabase doit être présent dans le dossier plugins du serveur.
# material/data sont facultatifs et servent de fallback.
#
# Alias acceptés :
# - head_database
# - head-database
# - hdb
# - hdb_id
# - head_id

exemple_hdb:
  slot: 21
  hdb: "REMPLACE_PAR_UN_ID_HDB"
  material: SKULL_ITEM
  data: 3
  name: "&eTête personnalisée"
  lore:
    - "&7Chargée depuis HeadDatabase."
  glow: true

# ------------------------------------------------------------
# 3. PLUSIEURS FILLERS DANS LE GUI DES QUÊTES
# ------------------------------------------------------------

quests:
  title: "&6Quêtes"
  size: 54

  # L'ancien bloc `filler:` reste accepté.
  # Le nouveau bloc `fillers:` permet plusieurs couches.
  fillers:

    top_border:
      enabled: true
      material: STAINED_GLASS_PANE
      data: 15
      name: " "
      slots: "0-8"

      # Ces slots ne recevront pas ce filler.
      exclude_slots: "1-6"

    bottom_border:
      enabled: true
      material: STAINED_GLASS_PANE
      data: 15
      name: " "
      slots: "45-53"

    glowing_corners:
      enabled: true
      material: STAINED_GLASS_PANE
      data: 4
      name: " "
      slots: "0,8,45,53"
      glow: true

    # Cette couche retire des fillers placés précédemment.
    remove_bottom_holes:
      enabled: true
      clear: true
      slots: "46-48,50-51"

  # Retire aussi des fillers après toutes les couches.
  clear_slots: "9,17,18,26,27,35"

  items:
    # Les items normaux sont placés APRÈS les fillers :
    # ils remplacent donc automatiquement le filler de leur slot.
    example:
      slot: 49
      material: NETHER_STAR
      name: "&eActualiser"
      glow: true
