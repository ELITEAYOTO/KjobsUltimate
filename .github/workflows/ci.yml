name: Build Java 8

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Tests et packaging
        run: mvn --batch-mode --no-transfer-progress clean verify
