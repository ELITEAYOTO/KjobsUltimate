# KjobsUltimate V3.16.3 — HUD
#
# IMPORTANT 1.8.8 : le faux Wither génère côté client une aura blanche sous
# 50 % de vie. Aucun réglage serveur ne peut la couper sans fausser la longueur
# de la bossbar. Le moteur utilise donc un faux Dragon envoyé uniquement au
# joueur. Son modèle n'obéit pas au drapeau invisible en 1.8 : il est caché
# sous le monde par une hauteur absolue sûre.

performance:
  scheduler_interval_ticks: 2
  actionbar_refresh_interval_ticks: 40

bossbar:
  enabled: true
  bossbar_timing_reset: 8
  update_interval_ticks: 40

  title_format: "&a{job} &7Lv.&e{level} &8| &a{xp}&8/&a{xp_next} &7XP"
  title_format_max_level: "&a{job} &7Lv.&e{level} &8| &6&lMAX"

  entity_type: ENDER_DRAGON
  max_health: 200.0
  minimum_progress: 0.05

  # Utile au Wither et conservé dans les métadonnées. En 1.8, ce drapeau seul
  # ne masque PAS le modèle du Dragon ; dragon_absolute_y assure ce rôle.
  invisible_entity: true
  follow_player: true
  hide_wither_particles: true

  placement:
    # AUTO / FRONT / FRONT_FAR / BELOW / ABOVE / PLAYER / EYE_FRONT
    profile: AUTO

    # FRONT classique.
    front_distance: 24.0

    # FRONT_FAR.
    front_far_distance: 40.0

    # Dragon AUTO : ancre absolue sous le monde normal. La valeur est limitée
    # par sécurité entre -62 et -16, car le client supprime l'entité sous -64.
    dragon_absolute_y: -60.0

    # Le Dragon reste proche en X/Z sans être téléporté à chaque actualisation.
    # À 12 blocs parcourus, un seul paquet de recentrage est envoyé.
    dragon_reanchor_distance: 12.0

    # Wither AUTO quand la barre est AU-DESSUS du seuil armored.
    auto_distance: 36.0
    auto_vertical_offset: -7.0

    # AUTO quand la barre est <= armored_threshold.
    #
    # On reste devant le joueur pour conserver la bossbar, mais l'entité est
    # nettement descendue afin de cacher les particules blanches sous la ligne
    # de vue / dans le terrain.
    armored_threshold: 0.50
    armored_distance: 28.0
    armored_vertical_offset: -18.0

  # BELOW / ABOVE.
  entity_offset_y: -12.0

  test_duration_seconds: 8

actionbar:
  enabled: true
  format: "&a{job} &7Lv.&e{level} &8| &a+{xp_gained} XP &8(&7{xp}&8/&7{xp_next}&8){autosell_suffix}"
  autosell_suffix: " &8| &6+{autosell_value}$ &7({autosell_items} objets)"
  autosell_only_format: "&6AutoSell &8| &a+{autosell_value}$ &7({autosell_items} objets)"
  currency_decimals: 2
  display_duration: 3
  accumulation_window_ms: 800

achievement:
  enabled: true
  mode: TITLE_AND_CHAT
  respect_hud_toggle: false
  force_chat_fallback: true
  reset_before_send: true
  popup_cooldown_ms: 2000

  title: "&6&lNIVEAU {level}"
  subtitle: "&b{job} &7atteint !"
  actionbar: "&6&lNIVEAU {level} &8- &b{job}"
  chat: "&6&lNIVEAU {level} &8- &b{job}"

  fade_in: 10
  stay: 50
  fade_out: 15

  vanilla_toast:
    enabled: true
    method: BUKKIT
    achievement: OPEN_INVENTORY
    force_reaward: true
    restore_if_not_previously_awarded: true
    restore_after_ticks: 60
    bukkit_after_packet_ticks: 2

    mapping:
      mineur: BUILD_PICKAXE
      farmer: MAKE_BREAD
      hunter: KILL_ENEMY
      pretorien: BUILD_SWORD
      artisan: BUILD_WORKBENCH
      pilleur: OVERPOWERED
