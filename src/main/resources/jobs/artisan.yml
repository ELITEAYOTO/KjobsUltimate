# ============================================================
# KjobsUltimate — Job : Artisan
# ============================================================
#
# V3.13 — ACCOUNTING DES CRAFTS
#
# Actions vanilla :
#   clé = Material du résultat (IRON_PICKAXE, ARROW, etc.)
#
# Actions Kcraft exactes :
#   clé = "KCRAFT:<craftId>"
#   IMPORTANT : garder les guillemets YAML autour de la clé.
#
# Ordre Kcraft :
#   1. "KCRAFT:<craftId>"
#   2. fallback sur le Material du résultat
#
# count_mode:
#   CRAFTS       = 1 unité par exécution de recette (défaut)
#   RESULT_ITEMS = 1 unité par item produit
#
# Exemple ARROW :
#   recette x4, 3 exécutions
#   CRAFTS       => 3 unités
#   RESULT_ITEMS => 12 unités
#
# allow_forced:
#   false = un craft Kcraft forcé/admin ne donne rien (défaut)
#   true  = autorise explicitement les crafts forcés
#
# Exemple exact Kcraft à copier si besoin :
#
#   "KCRAFT:pioche_azurite":
#     xp: 120
#     money: 10
#     silktouch: false
#     count_mode: CRAFTS
#     allow_forced: false
#
# XP, money, HUD et quêtes utilisent toujours la MÊME quantité.

display_name: "§eArtisan"
description: "§7Maîtrise la fabrication et produit des objets de qualité."
icon:
  material: WORKBENCH
  nbt_cit: "job_Artisan_icon"
max_level: 50

xp_curve:
  type: linear
  fallback_type: linear
  fallback_base: 600
  fallback_multiplier: 1.2
  custom_levels:
    1: 600
    2: 900
    3: 1300
    4: 1800
    5: 2500

daily_xp_cap: 0

bossbar:
  color: YELLOW
  style: SEGMENTED_10

level_rewards:
