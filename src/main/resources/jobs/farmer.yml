# ============================================================
# KjobsUltimate — Job : Farmer
# ============================================================
#
# V3.13 IMPORTANT — Bukkit 1.8.8
#   Le BLOC de blé est CROPS (ID 59).
#   WHEAT est l'item récolté.
#
# Compatibilité :
#   FarmerListener accepte encore une ancienne action WHEAT si CROPS n'est
#   pas configuré, afin de ne pas casser les anciens serveurs.
#
# Récoltes verticales :
#   SUGAR_CANE_BLOCK et CACTUS peuvent compter plusieurs unités lorsque le
#   joueur casse un bloc sous d'autres blocs identiques.
#
# Exemple :
#   canne Y66
#   canne Y65 <- cassée
#   canne Y64
#   => units=2 (Y65 + Y66), jamais Y64.
#
# La quantité units est utilisée simultanément pour XP + money + quête.

display_name: "§aFarmer"
description: "§7Cultive la terre et récolte les ressources naturelles."
icon:
  material: WHEAT
  nbt_cit: "job_farmer_icon"
max_level: 50

xp_curve:
  type: custom
  fallback_type: linear
  fallback_base: 800
  fallback_multiplier: 1.25
  custom_levels:
    1: 800
    2: 1200
    3: 1800
    4: 2500
    5: 3500
    6: 4800
    7: 6500
    8: 8500
    9: 11000
    10: 14000

daily_xp_cap: 0

bossbar:
  color: GREEN
  style: SOLID

level_rewards:
  5:
    - "eco give {player} 300"
  10:
    - "eco give {player} 1000"
    - "broadcast §a{player} §fpasse §aniveau 10 §fFarmer !"
  25:
    - "eco give {player} 6000"
  50:
    - "eco give {player} 30000"
    - "broadcast §a{player} §fa atteint le §aniveau MAXIMUM §fdu job Farmer !"

actions:
  CROPS:
    xp: 10
    money: 0
    silktouch: false
  CARROT:
    xp: 10
    money: 0
    silktouch: false
  POTATO:
    xp: 10
    money: 0
    silktouch: false
  MELON_BLOCK:
    xp: 8
    money: 0
    silktouch: false
  PUMPKIN:
    xp: 12
