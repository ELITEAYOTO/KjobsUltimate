# ============================================================
# KjobsUltimate — Job : Pilleur
# ============================================================

display_name: "§5Pilleur"
description: "§7Gagne de l'XP en pillant avec TNT et dynamite."
icon:
  material: TNT
  nbt_cit: "job_pilleur_icon"
max_level: 50

xp_curve:
  type: linear
  fallback_type: linear
  fallback_base: 800
  fallback_multiplier: 1.24
  custom_levels:
    1: 800
    2: 1200
    3: 1700
    4: 2300
    5: 3100
    6: 4100
    7: 5400
    8: 7000
    9: 9000
    10: 11500

daily_xp_cap: 0

bossbar:
  color: PURPLE
  style: SEGMENTED_10

level_rewards:
  5:
    - "[command] eco give {player} 500"
  10:
    - "[command] eco give {player} 2000"
    - "[command] broadcast §5{player} §fpasse §5niveau 10 §fPilleur !"
  25:
    - "[command] eco give {player} 10000"
  50:
    - "[command] eco give {player} 50000"
    - "[command] broadcast §5{player} §fa atteint le §5niveau MAXIMUM §fdu job Pilleur !"

actions:
  TNT_EXPLODE:
    xp: 12
    money: 0
    silktouch: false

  DYNAMITE_EXPLODE:
    xp: 20
    money: 0
    silktouch: false

  # Les crafts Pilleur sont comptés par item réellement produit.
  # Un shift-click de 16 TNT => 16 unités XP/quête/money.
  TNT_CRAFT:
    xp: 8
    money: 0
    silktouch: false
    count_mode: RESULT_ITEMS

  DYNAMITE_CRAFT:
    xp: 15
    money: 0
    silktouch: false
    count_mode: RESULT_ITEMS
    allow_forced: false
