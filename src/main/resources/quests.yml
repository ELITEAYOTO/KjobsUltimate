# ============================================================
# KjobsUltimate V3.14.1 — Quêtes permanentes
# ============================================================
#
# Une action physique ne fait progresser qu'une étape de chaque chaîne.
# Plusieurs chaînes différentes peuvent progresser en même temps.
#
# Types intégrés :
#   MINE              target = Material / Material:data miné
#   HARVEST           target = Material récolté
#   KILL              target = EntityType tué
#   CRAFT             target = Material du résultat
#   PVP_KILL          target = PLAYER
#   TNT_EXPLODE       target = TNT
#   DYNAMITE_EXPLODE  target = DYNAMITE
#   TNT_CRAFT         target = TNT
#   DYNAMITE_CRAFT    target = DYNAMITE
#   EAT               target = Material consommé
#   CONSUME           target = Material consommé
#   SMELT             target = Material retiré d'un four
#   FISH              target = Material / EntityType attrapé
#   FISH_ENTITY       target = EntityType attrapé
#   ENCHANT           target = Material enchanté
#   ENCHANT_LEVELS    amount = niveaux consommés
#   PLACE             target = Material posé
#   TAME              target = EntityType apprivoisé
#
# target: "*" accepte toute cible du type.
#
# rewards.xp :
#   XP du métier de la quête, accordée au claim.
#
# rewards.commands :
#   [console] commande console
#   [player]  commande joueur
#
# Placeholders :
#   {player} {uuid} {quest} {quest_id} {job}

