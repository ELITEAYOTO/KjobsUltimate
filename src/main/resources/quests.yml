# ============================================================
# KjobsUltimate - Quetes permanentes V1
# ============================================================
#
# Objectif V1:
# - quetes permanentes, pas de daily/weekly/reset automatique;
# - progression sauvegardee en SQLite/MySQL;
# - une recompense claimable une seule fois;
# - le GUI de claim sera branche sur QuestManager.claimReward().
#
# Types supportes:
#   MINE              target = Material casse par le mineur
#   HARVEST           target = Material recolte par farmer
#   KILL              target = EntityType tue par hunter
#   CRAFT             target = Material craft par artisan
#   PVP_KILL          target = PLAYER ou *
#   TNT_EXPLODE       target = TNT ou *
#   DYNAMITE_EXPLODE  target = DYNAMITE ou *
#   TNT_CRAFT         target = TNT ou *
#   DYNAMITE_CRAFT    target = DYNAMITE ou *
#   EAT               target = Material consomme (ex: COOKED_BEEF, GOLDEN_APPLE)
#   CONSUME           alias large de EAT, target = Material consomme
#   SMELT             target = Material retire d'un four (ex: IRON_INGOT)
#   FISH              target = Material peche ou EntityType attrape
#   FISH_ENTITY       target = EntityType attrape avec la canne
#   ENCHANT           target = Material enchante
#   ENCHANT_LEVELS    target = Material enchante, amount = niveaux consommes
#   PLACE             target = Material pose
#   TAME              target = EntityType apprivoise (ex: WOLF, OCELOT, HORSE)
#
# Notes creation:
# - target: "*" accepte tout pour ce type.
# - Les Material/EntityType doivent rester en noms Bukkit 1.8.8.
# - Une quete sans `chain` reste une chaine autonome retrocompatible.
# - Une suite declare sa chaine dans `chains:`, puis `chain` et `stage`
#   sur chaque quete. Les etapes doivent etre uniques et contigues (1, 2, 3).
# - Une seule etape progresse par chaine et par action. Plusieurs chaines
#   distinctes peuvent progresser simultanement.
#
# Recompenses:
#   rewards.xp       = XP de job donne au claim
#   rewards.commands = commandes executees au claim
# Placeholders commandes: {player}, {uuid}, {quest}, {quest_id}, {job}
# Prefixes commandes: [console], [command], [player], [joueur]

enabled: true

chains:
  mineur_stone:
    display_name: "&bSuite Pierre"
    job: mineur
  farmer_wheat:
