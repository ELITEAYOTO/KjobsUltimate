name: KjobsUltimate
version: ${project.version}
main: me.krunsh.kjobultimate.KjobUltimate
description: Systeme de jobs complet pour Volkaria
author: krunsh

# Kgui V2 est l'unique moteur GUI.
depend:
  - Kgui

# Hooks réellement utilisés par la base V2.
softdepend:
  - Vault
  - PlaceholderAPI
  - Kcraft
  - KStacker
  - Kfaction
  - Kminerai
  - Kenchantement

commands:
  jobs:
    description: Ouvre le menu des metiers
    usage: /jobs [menu|gui|text|help|top|infos|stats|join|leave|select|hud|quests|confirm|cancel]
    aliases: [job, metier, metiers]
    permission: kjobsultimate.use

  kjobs:
    description: Commandes staff KjobsUltimate
    usage: /kjobs <sous-commande>
    permission: kjobsultimate.admin

permissions:
  kjobsultimate.use:
    description: Utiliser /jobs
    default: true

  kjobsultimate.admin:
    description: Commandes admin KjobsUltimate
    default: op
    children:
      kjobsultimate.admin.reload: true
      kjobsultimate.admin.status: true
      kjobsultimate.admin.info: true
      kjobsultimate.admin.history: true
      kjobsultimate.admin.xp: true
      kjobsultimate.admin.level: true
      kjobsultimate.admin.reset: true
      kjobsultimate.admin.force: true
      kjobsultimate.admin.reward: true
      kjobsultimate.admin.backup: true
      kjobsultimate.admin.debug: true

  kjobsultimate.admin.*:
    description: Toutes les permissions admin KjobsUltimate
    default: op
    children:
      kjobsultimate.admin: true

  kjobsultimate.bypass.gamemodecheck:
    description: Gagner XP en mode creatif/spectateur
    default: false

  kjobsultimate.xp.vip:
    description: Multiplicateur XP VIP x1.25
    default: false

  kjobsultimate.xp.premium:
    description: Multiplicateur XP Premium x1.5
    default: false

  kjobsultimate.xp.youtuber:
    description: Multiplicateur XP Youtuber x2.0
    default: false
