# ============================================================
# KjobsUltimate V3.14 — Configuration principale
# Minecraft 1.8.8 / Java 8
# ============================================================
#
# Base V2/V3 propre : aucune clé legacy n'est nécessaire.
# Rechargement : /kjobs reload

# ─── Debug ──────────────────────────────────────────────────
# À laisser false hors diagnostic ciblé.
debug: false
debug_xp: false
debug_quest: false
debug_hud: false
debug_slots: false

# ─── Stockage ───────────────────────────────────────────────
storage:
  type: SQLITE
  sqlite_file: "data/KjobsUltimate.db"
  autosave_interval: 10

  sqlite:
    busy_timeout_ms: 5000
    wal_autocheckpoint_pages: 1000
    cache_size_kib: 8000
    journal_size_limit_bytes: 67108864

  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "kjobsultimate"
    username: "root"
    password: ""
    use_ssl: false
    connection_timeout_ms: 10000
    socket_timeout_ms: 30000
    extra_params: "useUnicode=true&characterEncoding=utf8&serverTimezone=UTC"
    pool:
      maximum_pool_size: 10
      minimum_idle: 2
      idle_timeout_ms: 600000
      max_lifetime_ms: 1800000
      leak_detection_ms: 0
      connection_test_query: "SELECT 1"

# ─── Premier join ───────────────────────────────────────────
join:
  default_all_jobs: false
  first_join_message: "§6§lBienvenue ! §7Choisis ton premier métier dans le menu !"

# ─── Slots de métiers ───────────────────────────────────────
job_slots:
  enabled: true
  default_slots: 2

  # TOTAL_LEVEL | HIGHEST_JOB_LEVEL | MAIN_JOB_LEVEL
  unlock_condition: TOTAL_LEVEL

  unlock_thresholds:
    3: 5
    4: 10
    5: 15
    6: 20

  max_slots: 6
  notify_unlock: true
  allow_job_change: true

  # Secondes. 28800 = 8 h.
  change_cooldown: 28800

# ─── Multiplicateurs XP ─────────────────────────────────────
# Formule :
# XP = base × meilleur multiplicateur permission
#           × event_multiplier
#           × bonus joueur
xp_multipliers:
  permissions:
    kjobsultimate.xp.vip: 1.25
    kjobsultimate.xp.premium: 1.5
    kjobsultimate.xp.youtuber: 2.0

  # Modifiable à chaud avec /kjobs event <valeur>.
  event_multiplier: 1.0

# ─── Anti-abuse ─────────────────────────────────────────────
anti_abuse:
  silktouch_enabled: true
  crops_mature_only: true

  # Cooldown RAM par position de bloc, en secondes.
  # Les positions sont stockées par BlockCooldownService V3.14 sous forme
  # compacte et bornée, pas dans PlayerData.
  block_position_cooldown: 300

  block_creative: true
  block_spectator: true

  # Canne à sucre / cactus.
  harvest:
    # Empêche un plugin tiers de recompter un bloc supérieur déjà inclus dans
    # la cascade. Protection très courte, indépendante du cooldown anti-farm.
    cascade_guard_ticks: 3

    vertical_crops:
      SUGAR_CANE_BLOCK:
        enabled: true
        max_units_per_break: 16
        max_scan: 16

      CACTUS:
        enabled: true
        max_units_per_break: 16
        max_scan: 16

  pvp:
    # Dernier hit retenu pour une mort indirecte (chute, feu...).
    last_hit_seconds: 20

    # Cooldown killer -> même victime, en secondes.
    victim_cooldown_seconds: 1200

    block_same_faction: true
    block_ally: true
    block_truce: true

    same_ip_block:
      enabled: false

    daily_kill_cap:
      enabled: true
      amount: 80
      window_seconds: 86400

  # Plafond global tous métiers confondus.
  daily_xp_cap:
    enabled: false
    amount: 5000

# ============================================================
# PERFORMANCE — V3.14 HOT PATH
# ============================================================
performance:
  hot_path:

    # --------------------------------------------------------
    # Cooldowns de blocs
    # --------------------------------------------------------
    block_cooldowns:
      # Limite RAM stricte PAR JOUEUR.
      # 4096 couvre environ 6-7 minutes à 10 blocs/s tout en empêchant une
      # croissance mémoire illimitée.
      max_entries_per_player: 4096

      # Un nettoyage des expirations est tenté après ce nombre de checks.
      # Une entrée consultée après expiration est toujours supprimée tout de
      # suite, indépendamment de ce compteur.
      cleanup_every_checks: 128

    # --------------------------------------------------------
    # XP
    # --------------------------------------------------------
    xp:
      # Cache du meilleur multiplicateur de permission d'un joueur.
      # 100 ticks = 5 s. Un changement LuckPerms peut donc prendre au maximum
      # environ 5 s à être reflété sans reconnect/reload.
      # 0 = désactive ce cache.
      permission_cache_ttl_ticks: 100

      # Protection mémoire. 2048 laisse une marge confortable pour 700 joueurs.
      permission_cache_max_players: 2048

      # /kjobs event modifie le multiplicateur en RAM. XpManager relit cette
      # valeur au maximum une fois par intervalle, pas à chaque bloc.
      event_multiplier_refresh_ticks: 20

      # Le job courant est vérifié à chaque gain. Le sweep de TOUS les métiers
      # n'est nécessaire que si daily_xp_cap global est actif.
      global_daily_sweep_interval_ticks: 200

    # --------------------------------------------------------
    # Kgui
    # --------------------------------------------------------
    ui_invalidation:
      enabled: true

      # 1 = fusionne toutes les mutations d'un même tick.
      flush_interval_ticks: 1

      # Budget de joueurs invalidés par flush. Avec 700 joueurs tous dirty en
      # même temps, 250 répartit la charge sur environ 3 ticks.
      max_players_per_flush: 250

# ─── Hooks ──────────────────────────────────────────────────
# Kgui V2 est obligatoire via plugin.yml / HookManager et n'a pas de toggle.
hooks:
  kcraft:
    enabled: true
  kfaction:
    enabled: true
  vault:
    enabled: true
  placeholderapi:
    enabled: true

# ─── Pilleur / TNT ──────────────────────────────────────────
pilleur:
  tnt_xp_limit:
    enabled: true
    amount: 128
    window_seconds: 28800

  dynamite_xp_limit:
    enabled: false

  # Le NBT sparrowmc-item est un contrat d'item existant volontairement gardé.
  dynamite_item:
    material: TNT
    data: -1
    nbt:
      sparrowmc-item: "dynamite"

# ─── Classements ────────────────────────────────────────────
top:
  chat_limit: 10
  gui_limit: 50
  cache_seconds: 30
