quests:
  title: "&6Quetes {target} &8- Page {page}"
  size: 54
  filter_job_slots: [1, 2, 3, 4, 5, 6]
  filler:
    enabled: true
    material: STAINED_GLASS_PANE
    data: 15
    name: " "
    lore: []
    slots: "45-53"
  items:
    filter_all:
      slot: 0
      material: COMPASS
      name: "&eToutes"
      lore:
        - "&7Voir toutes les quetes."
        - "&7Filtre actuel: &e{target}"
        - "&aClique pour filtrer."
      click_actions:
        - "[sound] CLICK 1.0 1.0"
        - "[quests] all"
      cooldown: 1
    filter_all_selected:
      slot: 0
      material: EMERALD
      name: "&aToutes &7({filter_status})"
      lore:
        - "&7Toutes les quetes sont affichees."
        - "&7Total: &e{total}"
        - "&a{selected}"
      click_actions:
        - "[sound] CLICK 1.0 1.0"
        - "[quests] all"
      cooldown: 1
    filter_job:
      material: BOOK
      name: "&e{job}"
      lore:
        - "&7Voir uniquement ce job."
        - "&7Etat: {filter_status}"
        - "&aClique pour filtrer."
      click_actions:
        - "[sound] CLICK 1.0 1.0"
        - "[quests] {job_id}"
      cooldown: 1
    filter_job_selected:
      material: ENCHANTED_BOOK
      name: "&a{job} &7({filter_status})"
      lore:
        - "&7Filtre actif."
        - "&7Total: &e{total}"
        - "&a{selected}"
      click_actions:
        - "[sound] CLICK 1.0 1.0"
        - "[quests] {job_id}"
      cooldown: 1
    quest:
      in_progress:
        slots: "10-16,19-25,28-34"
        material: PAPER
        name: "&e{quest}"
        lore:
          - "&7Job: {job}"
          - "&7Chaine: &f{chain} &8({stage}/{stage_total})"
          - "&7Statut: {quest_status}"
          - "&7Objectif: &f{target}"
          - "&7Progression: &a{progress}&7/&a{amount} &8({percent}%)"
          - "&7Recompense XP: &b{reward_xp}"
      paused_job:
        slots: "10-16,19-25,28-34"
        material: INK_SACK
        data: 14
        name: "&6{quest}"
        lore:
          - "&7Job: {job}"
          - "&7Chaine: &f{chain} &8({stage}/{stage_total})"
          - "&7Statut: {quest_status}"
          - "&7Progression conservee: &a{progress}&7/&a{amount}"
          - "&6Reprends ce metier pour continuer."
      locked_chain:
        slots: "10-16,19-25,28-34"
        material: PAPER
        name: "&8{quest}"
        lore:
          - "&7Job: {job}"
          - "&7Chaine: &f{chain} &8({stage}/{stage_total})"
          - "&7Statut: {quest_status}"
          - "&7Etape active: &f{active_quest}"
      locked_level:
        slots: "10-16,19-25,28-34"
        material: REDSTONE
        name: "&c{quest}"
        lore:
          - "&7Job: {job}"
          - "&7Chaine: &f{chain} &8({stage}/{stage_total})"
          - "&7Statut: {quest_status}"
          - "&7Niveau requis: &c{min_level}"
      claimable:
        slots: "10-16,19-25,28-34"
        material: ENCHANTED_BOOK
        name: "&a{quest}"
        lore:
          - "&7Job: {job}"
          - "&7Chaine: &f{chain} &8({stage}/{stage_total})"
          - "&7Statut: {quest_status}"
          - "&7Progression: &a{progress}&7/&a{amount} &8(100%)"
          - "&7Recompense XP: &b{reward_xp}"
          - ""
          - "&aClique pour recuperer."
        click_actions:
          - "[sound] CLICK 1.0 1.0"
          - "[quest_claim] {quest_id}"
        cooldown: 1
      claimed:
        slots: "10-16,19-25,28-34"
        material: BOOK
        name: "&8{quest}"
        lore:
          - "&7Job: {job}"
          - "&7Chaine: &f{chain} &8({stage}/{stage_total})"
          - "&7Statut: {quest_status}"
          - "&7Progression: &a{progress}&7/&a{amount}"
          - "&8Recompense deja recuperee."
    empty:
      slot: 22
      material: BARRIER
      name: "&cAucune quete"
      lore:
        - "&7Aucune quete disponible pour &e{target}&7."
    previous:
      slot: 45
      material: ARROW
      name: "&ePage precedente"
      lore:
        - "&7Aller page &e{previous_page}&7."
      click_actions:
        - "[sound] CLICK 1.0 1.0"
        - "[quests] previous"
      cooldown: 1
    next:
      slot: 53
      material: ARROW
      name: "&ePage suivante"
      lore:
        - "&7Aller page &e{next_page}&7."
      click_actions:
        - "[sound] CLICK 1.0 1.0"
        - "[quests] next"
      cooldown: 1
    refresh:
      slot: 49
      material: REDSTONE_COMPARATOR
      name: "&eActualiser"
      lore:
        - "&7Recharge les quetes."
      click_actions:
        - "[sound] CLICK 1.0 1.0"
        - "[quests] refresh"
      cooldown: 2
    back:
      slot: 52
      material: ARROW
      name: "&eRetour"
      lore:
        - "&7Retour au menu principal."
      click_actions:
        - "[sound] CLICK 1.0 1.0"
        - "[open] home"
